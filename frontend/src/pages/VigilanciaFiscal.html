<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilancia Fiscal IA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', sans-serif; color:#0f172a; background:#f8fafc; padding:20px; }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; gap:14px; align-items:center; margin-bottom:20px; }
        .header h1 { font-size:26px; font-weight:800; }
        .header p { color:#64748b; font-size:13px; }
        .control-panel { background:white; border:1px solid #e2e8f0; border-radius:14px; padding:18px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .control-panel label { display:block; font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:6px; }
        .control-panel select, .control-panel input, .control-panel button { padding:11px 14px; border:1.5px solid #cbd5e1; border-radius:9px; font-size:14px; }
        .control-panel button { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:white; border:none; cursor:pointer; font-weight:700; }
        .control-panel button:hover { opacity:0.9; }
        .status { margin-top:14px; padding:14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; color:#475569; font-size:13px; }
        .results { background:white; border:1px solid #e2e8f0; border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:18px; }
        .stat-card { background:white; border:1px solid #e2e8f0; border-left:4px solid #2563eb; border-radius:12px; padding:16px; }
        .stat-number { font-size:32px; font-weight:800; color:#2563eb; }
        .stat-label { font-size:12px; font-weight:700; color:#334155; margin-top:4px; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        table thead { border-bottom:2px solid #e2e8f0; }
        table th { padding:10px 8px; text-align:left; color:#64748b; font-weight:700; }
        table td { padding:11px 8px; border-bottom:1px solid #f1f5f9; }
        .badge { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:800; }
        .badge-critica { background:#dc2626; color:white; }
        .badge-alta { background:#ea580c; color:white; }
        .badge-media { background:#ca8a04; color:white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size:34px;">⚖️</div>
            <div>
                <h1>Vigilancia Fiscal IA</h1>
                <p>Cruce en tiempo real · SECOP II × SIRI (Procuraduría) × Boletín (Contraloría)</p>
            </div>
        </div>

        <div class="control-panel">
            <label>Entidad a auditar</label>
            <div style="display:flex; gap:12px; margin-bottom:14px;">
                <select id="entidad" style="flex:1; min-width:220px;">
                    <option>USME</option>
                    <option>KENNEDY</option>
                    <option>BOSA</option>
                    <option>IDU</option>
                    <option>SECRETARIA DE EDUCACION</option>
                </select>
                <button id="btnAnalizar">Analizar</button>
            </div>
            <div id="status" class="status" style="display:none;">
                Analizando... <span id="cronometro">0:00</span>
            </div>
        </div>

        <div id="resultados" class="results" style="display:none;">
            <div class="stats" id="stats"></div>
            <table>
                <thead>
                    <tr>
                        <th>Nivel</th>
                        <th>Proveedor</th>
                        <th>Antecedente</th>
                        <th>Fuente</th>
                        <th style="text-align:right;">Valor</th>
                    </tr>
                </thead>
                <tbody id="alertasTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const btnAnalizar = document.getElementById('btnAnalizar');
        const entidadSelect = document.getElementById('entidad');
        const statusDiv = document.getElementById('status');
        const resultadosDiv = document.getElementById('resultados');
        const statsDiv = document.getElementById('stats');
        const alertasTable = document.getElementById('alertasTable');
        const cronometroSpan = document.getElementById('cronometro');

        const COLORES = {
            CRITICA: '#dc2626',
            ALTA: '#ea580c',
            MEDIA: '#ca8a04',
            INFO: '#64748b'
        };

        btnAnalizar.addEventListener('click', analizar);

        async function analizar() {
            const entidad = entidadSelect.value;
            btnAnalizar.disabled = true;
            statusDiv.style.display = 'block';
            resultadosDiv.style.display = 'none';
            alertasTable.innerHTML = '';
            statsDiv.innerHTML = '';

            let tiempo = 0;
            const timer = setInterval(() => {
                tiempo++;
                cronometroSpan.textContent = Math.floor(tiempo / 60) + ':' + String(tiempo % 60).padStart(2, '0');
            }, 1000);

            try {
                const response = await fetch(`https://sistema-gestion-contractual.onrender.com/api/vfi/analizar-stream?entidad=${encodeURIComponent(entidad)}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.total_alertas !== undefined) {
                                    mostrarResultados(data);
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }

            clearInterval(timer);
            statusDiv.style.display = 'none';
            btnAnalizar.disabled = false;
        }

        function mostrarResultados(resultado) {
            resultadosDiv.style.display = 'block';

            // Stats
            statsDiv.innerHTML = `
                <div class="stat-card" style="border-left-color:#2563eb;">
                    <div class="stat-number">${resultado.total_contratos}</div>
                    <div class="stat-label">Contratos analizados</div>
                </div>
                <div class="stat-card" style="border-left-color:#0f172a;">
                    <div class="stat-number">${resultado.total_alertas}</div>
                    <div class="stat-label">Alertas totales</div>
                </div>
                <div class="stat-card" style="border-left-color:#dc2626;">
                    <div class="stat-number">${resultado.criticas}</div>
                    <div class="stat-label">Críticas</div>
                </div>
                <div class="stat-card" style="border-left-color:#ea580c;">
                    <div class="stat-number">${resultado.altas}</div>
                    <div class="stat-label">Altas</div>
                </div>
            `;

            // Tabla
            alertasTable.innerHTML = resultado.alertas.slice(0, 50).map(a => `
                <tr>
                    <td><span class="badge badge-${a.nivel.toLowerCase()}">${a.nivel}</span></td>
                    <td><strong>${a.proveedor_secop}</strong><br><small>${a.documento}</small></td>
                    <td>${a.sancion}</td>
                    <td>${a.fuente}</td>
                    <td style="text-align:right; font-family:monospace; font-weight:700;">$${parseInt(a.valor || 0).toLocaleString('es-CO')}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
